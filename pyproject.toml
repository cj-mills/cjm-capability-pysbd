[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cjm-capability-pysbd"
dynamic = ["version"]
description = "A pySBD-based sentence-segmentation capability for the cjm-substrate runtime — rule-based Golden-Rules sentence boundaries as character spans over the original text."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Christian J. Mills", email = "9126128+cj-mills@users.noreply.github.com"}]
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['cjm-substrate>=0.0.58', 'cjm-capability-primitives>=0.0.11', 'pysbd']

[project.optional-dependencies]
test = ['cjm-sentence-segmentation-adapter-interface>=0.0.1', 'pytest']

[project.urls]
Repository = "https://github.com/cj-mills/cjm-capability-pysbd"


[tool.setuptools.dynamic]
version = {attr = "cjm_capability_pysbd.__version__"}

[tool.setuptools.packages.find]
include = ["cjm_capability_pysbd*"]
